name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test the built public application
        run: npm run e2e:public

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration history
        run: npm run db:check

      - name: Test fresh install and historical upgrade
        run: npm run db:test-migrations
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/cinekin_migration_test
          MIGRATION_TEST_ALLOW_DROP: "1"

      - name: Create the disposable bounded-purge test database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE IF NOT EXISTS cinekin_purge_bound_test;"

      - name: Migrate the bounded-purge test database (versioned migrations only, never push)
        run: npm run db:migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/cinekin_purge_bound_test

      - name: Prove the revocation purge is really bounded to 100 rows (real MySQL, not a mock)
        run: npx vitest run server/lib/session-revocation.purge-bound.test.ts --project server
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/cinekin_purge_bound_test

  e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # Disposable, CI-local database and fictitious secrets only — never a
      # real credential, never Aiven/Render/production connectivity.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cinekin_e2e_test
      SESSION_SECRET: test-only-fake-session-secret-0123456789
      ENCRYPTION_KEY: test-only-fake-encryption-key-0123456789
      APP_SECRET: test-only-fake-app-secret-0123456789
      E2E_ADMIN_PASSWORD: test-only-fake-admin-password

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create the disposable E2E database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE IF NOT EXISTS cinekin_e2e_test;"

      - name: Migrate the E2E database (versioned migrations only, never push)
        run: npm run db:migrate

      - name: Build the application
        run: npm run build

      - name: Run the browser E2E suite (logout + cookie-replay) against the real built app
        run: npm run e2e:browser:full
